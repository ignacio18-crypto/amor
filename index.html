<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Para Ti 🌻</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #fdf6e3; --warm: #f5e6c8; --gold: #e8a020;
      --rose: #e8748a; --rose-light: #f0a0b0; --rose-pale: #fce8ed;
      --green-light: #8db87e; --brown: #7a5230; --ink: #3d2b1a;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: var(--cream); font-family: 'Lora', serif; overflow-x: hidden; position: relative; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 10%, rgba(255,220,120,0.25) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(232,116,138,0.15) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    .floatie { position: fixed; pointer-events: none; z-index: 1; animation: floatUp linear infinite; opacity: 0; font-size: 1.4rem; }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.7; }
      100% { transform: translateY(-100vh) rotate(360deg) scale(1.1); opacity: 0; }
    }
    #loginScreen { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: var(--cream); transition: opacity 0.6s; }
    #loginScreen.hide { opacity: 0; pointer-events: none; }
    .login-card { width: 90%; max-width: 380px; background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); border-radius: 24px; padding: 2rem; text-align: center; border: 1px solid rgba(232,116,138,0.18); }
    .login-card h1 { font-family: 'Playfair Display', serif; color: var(--rose); margin-bottom: 1rem; }
    .login-field { margin-bottom: 1rem; text-align: left; }
    .login-field label { display: block; font-family: 'Caveat', cursive; margin-bottom: 0.3rem; }
    .login-field input { width: 100%; border: 1.5px solid rgba(232,116,138,0.25); border-radius: 12px; padding: 0.8rem; font-family: 'Caveat', cursive; font-size: 1.1rem; outline: none; }
    .login-btn { width: 100%; background: var(--rose); color: white; border: none; border-radius: 12px; padding: 0.9rem; font-family: 'Playfair Display', serif; cursor: pointer; }
    #app { display: none; position: relative; z-index: 2; padding: 1.5rem; max-width: 600px; margin: 0 auto; }
    #app.visible { display: block; }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
    .board-frame { background: var(--brown); border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .board { background: #1e1008; border-radius: 6px; padding: 2rem; min-height: 200px; text-align: center; color: #fdf0dc; position: relative; }
    .chalk-text { font-family: 'Caveat', cursive; font-size: 1.8rem; line-height: 1.4; white-space: pre-wrap; }
    .write-panel { margin-top: 2rem; background: var(--rose-pale); padding: 1.5rem; border-radius: 16px; }
    textarea { width: 100%; height: 100px; border-radius: 10px; padding: 1rem; font-family: 'Caveat', cursive; font-size: 1.2rem; margin-bottom: 1rem; border: 1px solid var(--rose-light); }
    .history-item { background: white; margin-top: 0.5rem; padding: 1rem; border-radius: 10px; display: flex; justify-content: space-between; font-family: 'Caveat', cursive; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--rose); color: white; padding: 0.8rem 1.5rem; border-radius: 50px; transition: 0.4s; z-index: 1000; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="toast"></div>

  <div id="loginScreen">
    <div class="login-card">
      <h1>Hola 🌻</h1>
      <div class="login-field">
        <label>Nombre</label>
        <input type="text" id="loginNombre" placeholder="Tu nombre">
      </div>
      <div class="login-field">
        <label>Apellido</label>
        <input type="text" id="loginApellido" placeholder="Tu apellido">
      </div>
      <button class="login-btn" onclick="doLogin()">Entrar 🌸</button>
      <p id="loginError" style="color:red; font-size:0.8rem; margin-top:10px;"></p>
    </div>
  </div>

  <div id="app">
    <div class="top-bar">
      <div id="userBadge" style="font-family:'Caveat'; font-size:1.2rem;"></div>
      <button onclick="doLogout()" style="background:none; border:none; cursor:pointer;">Salir 🚪</button>
    </div>

    <header style="text-align:center; margin-bottom:2rem;">
      <h1 style="font-family:'Playfair Display'; color:var(--rose);">Para Ti, Mi Amor</h1>
    </header>

    <div class="board-frame">
      <div class="board">
        <div id="loader" class="loading-overlay">⏳</div>
        <div id="chalkText" class="chalk-text">Cargando mensaje...</div>
        <div id="boardDate" style="margin-top:1rem; opacity:0.5; font-size:0.8rem;"></div>
      </div>
    </div>

    <div id="writePanel" class="write-panel" style="display:none;">
      <textarea id="msgInput" placeholder="Escribe algo lindo para hoy..."></textarea>
      <button class="login-btn" id="sendBtn" onclick="sendMessage()">Poner en la pizarra 💌</button>
    </div>

    <div id="readonlyBanner" style="display:none; text-align:center; margin-top:2rem; font-family:'Caveat'; opacity:0.7;">
      🌻 Cada día aparecerá un mensaje nuevo aquí 💛
    </div>

    <div style="margin-top:3rem;">
      <h2 style="font-family:'Playfair Display'; font-size:1.2rem; text-align:center;">Mensajes pasados</h2>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    // === TUS CREDENCIALES REALES ===
    const BIN_ID  = '69c762eeaa77b81da92a5074';
    const API_KEY = '$2a$10$ULqyvo9Ld7OrgfTQAMAuVewv2GCHHWKKCWrFb8DT8gQFexyuPN.4e';
    const URL     = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const USERS = {
      'constanza soto':   { role: 'viewer', display: 'Constanza', emoji: '🌸' },
      'ignacio calderon': { role: 'writer', display: 'Ignacio',   emoji: '✍️' },
    };

    const SESSION_KEY = 'amor_session_v2';

    function normalize(str) {
      return str.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function doLogin() {
      const n = normalize(document.getElementById('loginNombre').value);
      const a = normalize(document.getElementById('loginApellido').value);
      const user = USERS[n + ' ' + a];
      if (user) {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({key: n+' '+a, ...user}));
        location.reload();
      } else {
        document.getElementById('loginError').textContent = 'No estás en la lista de invitados 💔';
      }
    }

    function doLogout() { sessionStorage.removeItem(SESSION_KEY); location.reload(); }

    async function getMessages() {
      try {
        const res = await fetch(URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
        const data = await res.json();
        return data.record.mensajes || [];
      } catch(e) { return []; }
    }

    async function saveMessages(msgs) {
      await fetch(URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
        body: JSON.stringify({ mensajes: msgs })
      });
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    async function render() {
      const session = JSON.parse(sessionStorage.getItem(SESSION_KEY));
      const msgs = await getMessages();
      const today = todayStr();
      const todayMsg = msgs.find(m => m.date === today);

      document.getElementById('chalkText').textContent = todayMsg ? todayMsg.text : "Aún no hay mensaje hoy... 🌻";
      document.getElementById('boardDate').textContent = todayMsg ? today : "";

      if (session.role === 'writer') {
        document.getElementById('writePanel').style.display = 'block';
        document.getElementById('sendBtn').disabled = !!todayMsg;
        if(todayMsg) document.getElementById('sendBtn').textContent = "Ya enviado ✅";
      } else {
        document.getElementById('readonlyBanner').style.display = 'block';
      }

      const history = msgs.filter(m => m.date !== today).reverse();
      document.getElementById('historyList').innerHTML = history.map(m => `
        <div class="history-item">
          <span>${m.text}</span>
          <small style="opacity:0.5">${m.date}</small>
        </div>
      `).join('');
    }

    async function sendMessage() {
      const txt = document.getElementById('msgInput').value.trim();
      if (!txt) return;
      document.getElementById('loader').style.display = 'flex';
      const msgs = await getMessages();
      msgs.push({ date: todayStr(), text: txt });
      await saveMessages(msgs);
      location.reload();
    }

    // Inicialización
    (function() {
      const s = sessionStorage.getItem(SESSION_KEY);
      if (s) {
        const user = JSON.parse(s);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').classList.add('visible');
        document.getElementById('userBadge').textContent = user.emoji + ' ' + user.display;
        render();
      }
    })();

    // Decoración: Flores flotantes
    function spawn() {
      const el = document.createElement('div');
      el.className = 'floatie';
      el.textContent = ['🌻','💛','🌸'][Math.floor(Math.random()*3)];
      el.style.left = Math.random()*90+'vw';
      el.style.bottom = '-20px';
      el.style.animationDuration = (5+Math.random()*5)+'s';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 10000);
    }
    setInterval(spawn, 3000);
  </script>
</body>
</html>
