<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>SpiderLove 🕷️💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@300;400;600;700;800&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --red: #cc0000; --spider-red: #e31515; --blue: #1a1aff;
      --heart-pink: #ff4d80; --gold: #ffd700; --bg: #0a0010;
      --card-bg: rgba(12,0,30,0.92); --text: #fff5f5; --text-dim: rgba(255,245,245,0.6);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { min-height: 100vh; background: var(--bg); font-family: 'Nunito', sans-serif; overflow-x: hidden; color: var(--text); }
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 900px 700px at 20% 30%, rgba(180,0,0,0.25), transparent),
        radial-gradient(ellipse 700px 600px at 80% 70%, rgba(0,0,180,0.2), transparent),
        radial-gradient(ellipse 500px 400px at 50% 50%, rgba(120,0,60,0.15), transparent);
    }
    .hearts-container { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .heart-float { position: absolute; bottom: -60px; font-size: 1.5rem; animation: floatHeart linear infinite; opacity: 0; }
    @keyframes floatHeart {
      0%   { transform: translateY(0) rotate(-10deg) scale(0.7); opacity:0; }
      10%  { opacity:0.7; }
      90%  { opacity:0.5; }
      100% { transform: translateY(-110vh) rotate(20deg) scale(1.1); opacity:0; }
    }

    /* LOGIN */
    #loginScreen {
      position: fixed; inset: 0; z-index: 200; overflow-y: auto;
      display: flex; align-items: center; justify-content: center; background: rgba(5,0,15,0.95);
    }
    .login-card {
      width: 92%; max-width: 420px; margin: 1rem 0; background: var(--card-bg); border-radius: 20px;
      border: 2px solid rgba(200,0,0,0.4); box-shadow: 0 0 60px rgba(200,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
      overflow: hidden; animation: cardDrop 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes cardDrop { from { transform: translateY(-60px) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    .spidey-scene {
      position: relative; height: 220px;
      background: linear-gradient(180deg, #1a0000 0%, #0a0020 100%);
      border-bottom: 2px solid rgba(200,0,0,0.3); overflow: hidden;
    }
    .web-top { position: absolute; top: 0; left: 0; right: 0; height: 100%; pointer-events: none; }
    .web-string {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 2px; height: 90px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
      filter: drop-shadow(0 0 3px rgba(255,255,255,0.4));
    }
    .spidey-wrapper {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      animation: spideySway 3s ease-in-out infinite; filter: drop-shadow(0 10px 20px rgba(200,0,0,0.4));
    }
    @keyframes spideySway { 0%,100% { transform: translateX(-50%) rotate(-4deg); } 50% { transform: translateX(-50%) rotate(4deg); } }
    .spidey-hearts span { position: absolute; font-size: 1.2rem; animation: heartBeat 2s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(255,77,128,0.8)); }
    @keyframes heartBeat { 0%,100% { transform: scale(1); opacity:0.8; } 50% { transform: scale(1.3); opacity:1; } }

    .login-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .tab-btn {
      flex: 1; padding: 0.9rem 0.5rem; background: transparent; border: none;
      font-family: 'Bangers', cursive; font-size: 1.2rem; letter-spacing: 1.5px;
      color: var(--text-dim); cursor: pointer; transition: all 0.3s; border-bottom: 3px solid transparent;
    }
    .tab-btn.active { color: #fff; background: rgba(200,0,0,0.12); border-bottom-color: var(--spider-red); }
    .tab-btn:hover { color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .login-form { padding: 1.8rem 2rem 2rem; }
    .login-title {
      font-family: 'Bangers', cursive; font-size: 2.2rem; color: var(--spider-red); text-align: center;
      letter-spacing: 3px; margin-bottom: 0.2rem; text-shadow: 3px 3px 0 rgba(0,0,0,0.5), 0 0 20px rgba(227,21,21,0.5);
    }
    .login-sub { text-align: center; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1.5rem; font-weight: 300; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,100,100,0.8); margin-bottom: 0.4rem; }
    .field input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(200,0,0,0.25); border-radius: 10px;
      padding: 0.85rem 1rem; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 0.95rem; outline: none; transition: all 0.3s;
    }
    .field input::placeholder { color: rgba(255,255,255,0.25); }
    .field input:focus { border-color: rgba(200,0,0,0.6); box-shadow: 0 0 0 3px rgba(200,0,0,0.15); background: rgba(255,255,255,0.08); }
    .login-btn {
      width: 100%; margin-top: 0.5rem; background: linear-gradient(135deg, #cc0000, #ff2020, #cc0000); background-size: 200%;
      color: white; border: none; border-radius: 12px; padding: 1rem; font-family: 'Bangers', cursive; font-size: 1.4rem;
      letter-spacing: 2px; cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 20px rgba(200,0,0,0.4);
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(200,0,0,0.55); }
    .login-btn:active { transform: translateY(0); }
    .login-btn.pink { background: linear-gradient(135deg, #d6246e, #ff4d80, #d6246e); box-shadow: 0 5px 20px rgba(255,77,128,0.4); }
    .login-btn.pink:hover { box-shadow: 0 10px 30px rgba(255,77,128,0.55); }
    .guest-note { text-align: center; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 1rem; }
    #loginError { text-align: center; font-size: 0.83rem; color: var(--heart-pink); margin-top: 0.8rem; min-height: 1.2rem; font-weight: 600; }

    /* APP */
    #app { display:none; position: relative; z-index: 2; max-width: 680px; margin: 0 auto; padding: 1.5rem 1.2rem 3rem; }
    #app.visible { display: block; animation: fadeUp 0.5s ease-out; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding: 0.8rem 1rem;
      background: rgba(200,0,0,0.1); border-radius: 12px; border: 1px solid rgba(200,0,0,0.2);
    }
    .user-badge { font-family: 'Bangers', cursive; font-size: 1.3rem; letter-spacing: 1.5px; color: var(--spider-red); text-shadow: 0 0 10px rgba(227,21,21,0.4); }
    .logout-btn {
      background: rgba(200,0,0,0.15); border: 1px solid rgba(200,0,0,0.3); border-radius: 20px; padding: 0.4rem 1rem;
      color: rgba(255,150,150,0.9); font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
    }
    .logout-btn:hover { background: rgba(200,0,0,0.3); }

    .main-title { text-align: center; margin-bottom: 1.5rem; }
    .main-title h1 { font-family: 'Bangers', cursive; font-size: 3rem; color: var(--spider-red); letter-spacing: 3px; text-shadow: 4px 4px 0 rgba(0,0,0,0.5), 0 0 30px rgba(227,21,21,0.4); line-height: 1; }
    .main-title p { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.3rem; letter-spacing: 0.5px; }

    /* NAV entre ventanas */
    .nav-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .nav-btn {
      flex: 1; position: relative; padding: 0.8rem 0.5rem; border-radius: 12px; cursor: pointer;
      background: rgba(255,255,255,0.04); border: 1.5px solid rgba(200,0,0,0.25); color: var(--text-dim);
      font-family: 'Bangers', cursive; font-size: 1.1rem; letter-spacing: 1px; transition: all 0.3s;
    }
    .nav-btn.active { color: #fff; background: rgba(200,0,0,0.2); border-color: var(--spider-red); box-shadow: 0 0 15px rgba(200,0,0,0.3); }
    .nav-btn .dot {
      display: none; position: absolute; top: -6px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px;
      border-radius: 11px; background: var(--heart-pink); color: #fff; font-family: 'Nunito', sans-serif;
      font-size: 0.75rem; font-weight: 800; line-height: 22px; text-align: center; box-shadow: 0 0 10px rgba(255,77,128,0.7);
    }
    .view { display: none; }
    .view.active { display: block; }

    .board-card {
      background: var(--card-bg); border-radius: 18px; border: 2px solid rgba(200,0,0,0.3); overflow: hidden;
      box-shadow: 0 0 40px rgba(200,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05); margin-bottom: 1.5rem;
    }
    .board-header {
      background: linear-gradient(135deg, rgba(200,0,0,0.3), rgba(0,0,200,0.2)); padding: 0.8rem 1.5rem;
      display: flex; align-items: center; gap: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .board-header span { font-family: 'Bangers', cursive; font-size: 1.1rem; letter-spacing: 1px; }
    .board-body { padding: 2rem 1.8rem; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .msg-text { font-family: 'Caveat', cursive; font-size: 2rem; line-height: 1.5; text-align: center; color: #fff; white-space: pre-wrap; text-shadow: 0 0 20px rgba(255,77,128,0.3); }
    .msg-date { margin-top: 1rem; font-size: 0.78rem; color: var(--text-dim); letter-spacing: 0.5px; }
    .board-loader { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; font-size: 2rem; backdrop-filter: blur(3px); }
    .ticks-row { display: none; align-items: center; gap: 4px; margin-top: 0.8rem; font-size: 0.78rem; color: var(--text-dim); }
    .tick-icon { font-size: 1rem; }

    .write-panel {
      background: var(--card-bg); border: 2px solid rgba(0,0,200,0.25); border-radius: 18px; padding: 1.8rem;
      margin-bottom: 1.5rem; display: none; box-shadow: 0 0 30px rgba(0,0,180,0.15);
    }
    .write-panel h3 { font-family: 'Bangers', cursive; font-size: 1.5rem; letter-spacing: 2px; color: rgba(100,150,255,0.9); margin-bottom: 1.2rem; text-shadow: 0 0 10px rgba(100,150,255,0.3); }
    .write-panel.pink { border-color: rgba(255,77,128,0.35); box-shadow: 0 0 30px rgba(255,77,128,0.15); }
    .write-panel.pink h3 { color: var(--heart-pink); text-shadow: 0 0 10px rgba(255,77,128,0.3); }
    textarea {
      width: 100%; height: 110px; background: rgba(255,255,255,0.04); border: 1.5px solid rgba(0,0,200,0.2); border-radius: 12px;
      padding: 1rem; color: var(--text); font-family: 'Caveat', cursive; font-size: 1.3rem; outline: none; resize: vertical; transition: all 0.3s; margin-bottom: 1rem;
    }
    textarea::placeholder { color: rgba(255,255,255,0.2); }
    textarea:focus { border-color: rgba(0,0,255,0.4); box-shadow: 0 0 0 3px rgba(0,0,255,0.1); }
    textarea:disabled { opacity: 0.4; }
    .write-panel.pink textarea { border-color: rgba(255,77,128,0.25); }
    .write-panel.pink textarea:focus { border-color: rgba(255,77,128,0.6); box-shadow: 0 0 0 3px rgba(255,77,128,0.15); }
    .send-btn {
      width: 100%; background: linear-gradient(135deg, #0000cc, #2222ff, #0000cc); color: white; border: none; border-radius: 12px;
      padding: 1rem; font-family: 'Bangers', cursive; font-size: 1.5rem; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 20px rgba(0,0,200,0.3);
    }
    .send-btn.pink { background: linear-gradient(135deg, #d6246e, #ff4d80, #d6246e); box-shadow: 0 5px 20px rgba(255,77,128,0.4); }
    .send-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .cooldown-note { text-align: center; font-size: 0.85rem; color: var(--gold); margin-bottom: 1rem; font-weight: 600; display: none; }

    .media-box img, .media-box video, .h-body img, .h-body video { display:block; max-width:100%; max-height:340px; border-radius:12px; margin:0.8rem auto 0; background:#000; }
    .h-body { flex:1; min-width:0; }
    .h-seen { margin-top:0.5rem; font-size:0.75rem; color:#06b6d4; }
    .attach-row { display:flex; align-items:center; gap:0.6rem; margin-bottom:1rem; flex-wrap:wrap; }
    .attach-btn { background:rgba(255,255,255,0.06); border:1.5px dashed rgba(100,150,255,0.5); color:#fff; border-radius:12px; padding:0.6rem 1rem; font-family:'Nunito',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; }
    #attachName { font-size:0.82rem; color:var(--gold); word-break:break-all; }
    #attachClear, #cAttachClear { display:none; background:none; border:none; color:var(--heart-pink); font-size:1.1rem; cursor:pointer; }
    .rec-btn { background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,77,128,0.4); color:#fff; border-radius:12px; padding:0.6rem 1rem; font-family:'Nunito',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; }
    .rec-btn.recording { background:rgba(227,21,21,0.3); border-color:#e31515; animation:recPulse 1s ease-in-out infinite; }
    @keyframes recPulse { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
    .rec-time { font-size:0.82rem; color:var(--gold); font-weight:700; }
    .audio-preview { display:none; width:100%; margin-bottom:1rem; }

    /* COMPOSER ESTILO WHATSAPP */
    .write-panel { position: relative; padding-bottom: 1.4rem; }
    .attach-preview { display: none; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
    .attach-preview span#attachName, .attach-preview span#cAttachName { font-size: 0.82rem; color: var(--gold); word-break: break-all; }
    .attach-preview button { background: none; border: none; color: var(--heart-pink); font-size: 1.1rem; cursor: pointer; }
    #composer, #cComposer { display: flex; align-items: flex-end; gap: 0.6rem; position: relative; }
    .field { flex: 1; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(200,0,0,0.25); border-radius: 26px; display: flex; align-items: flex-end; min-height: 48px; padding: 0 4px; }
    #composer .field, #cComposer .field { margin-bottom: 0; }
    .write-panel.pink .field { border-color: rgba(255,77,128,0.3); }
    .field textarea { flex: 1; border: 0; outline: 0; background: none; color: var(--text); font-family: 'Caveat', cursive; font-size: 1.25rem; line-height: 1.3; resize: none; max-height: 110px; padding: 0.7rem 0.3rem; margin-bottom: 0; height: auto; }
    .field textarea::placeholder { color: rgba(255,255,255,0.25); }
    .ib { border: 0; background: none; color: var(--gold); width: 38px; height: 46px; display: grid; place-items: center; font-size: 1.3rem; cursor: pointer; flex: none; }
    #act, #cAct { width: 48px; height: 48px; border-radius: 50%; border: none; background: linear-gradient(135deg, #cc0000, #ff2020); color: #fff; display: grid; place-items: center; flex: none; cursor: pointer; touch-action: none; user-select: none; font-size: 1.3rem; box-shadow: 0 5px 16px rgba(200,0,0,0.4); transition: transform .15s; }
    .write-panel.pink #cAct { background: linear-gradient(135deg, #d6246e, #ff4d80); box-shadow: 0 5px 16px rgba(255,77,128,0.4); }
    #act.rec, #cAct.rec { transform: scale(1.4); }
    .pop { position: absolute; left: 0; right: 0; bottom: 58px; background: rgba(12,0,30,0.97); border: 1px solid rgba(200,0,0,0.3); border-radius: 18px; box-shadow: 0 0 24px rgba(200,0,0,0.25); z-index: 5; }
    #menu, #cMenu { display: grid; grid-template-columns: repeat(2,1fr); padding: 1rem 0.6rem; }
    #menu button, #cMenu button { border: 0; background: none; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 0.4rem; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    #menu .c, #cMenu .c { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; }
    .c.cam { background: #c2185b; } .c.gal { background: #e03a2a; }
    .emo { display: grid; grid-template-columns: repeat(8,1fr); padding: 0.6rem; font-size: 1.4rem; text-align: center; max-height: 220px; overflow-y: auto; }
    .emo span { cursor: pointer; padding: 0.2rem 0; }
    #recbar, #cRecbar { position: absolute; left: 0; right: 56px; bottom: 0; height: 48px; border-radius: 26px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(200,0,0,0.25); display: flex; align-items: center; gap: 0.6rem; padding: 0 1rem; }
    #recbar .dot, #cRecbar .dot { width: 9px; height: 9px; border-radius: 50%; background: #e31515; animation: recPulse 1s infinite; }
    #recbar .sl, #cRecbar .sl { margin-left: auto; color: var(--text-dim); font-size: 0.78rem; }
    #lock, #cLock { position: absolute; right: 0; bottom: 56px; width: 38px; height: 66px; border-radius: 18px; background: rgba(12,0,30,0.95); border: 1px solid rgba(200,0,0,0.3); color: var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem; font-size: 0.78rem; }
    audio { display:block; width:100%; margin:0.8rem auto 0; }
    .readonly-msg { text-align: center; color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1.5rem; display: none; }

    /* CHAT UNIFICADO ESTILO WHATSAPP */
    .chat-feed { display: flex; flex-direction: column; gap: 0.6rem; max-height: 58vh; overflow-y: auto; padding: 0.6rem 0.3rem 1rem; margin-bottom: 1.2rem; -webkit-overflow-scrolling: touch; }
    .chat-empty { text-align: center; opacity: 0.45; font-family: 'Caveat', cursive; font-size: 1.2rem; margin: 2rem 0; }
    .bubble { max-width: 78%; padding: 0.7rem 1rem 0.5rem; border-radius: 16px; }
    .bubble.align-right { align-self: flex-end; border-bottom-right-radius: 4px; }
    .bubble.align-left { align-self: flex-start; border-bottom-left-radius: 4px; }
    .bubble.from-ignacio { background: linear-gradient(135deg, rgba(0,0,200,0.32), rgba(0,0,255,0.2)); border: 1px solid rgba(100,150,255,0.35); }
    .bubble.from-constanza { background: rgba(255,77,128,0.16); border: 1px solid rgba(255,77,128,0.3); }
    .bubble .b-text { font-family: 'Caveat', cursive; font-size: 1.25rem; color: var(--text); white-space: pre-wrap; line-height: 1.35; }
    .bubble .b-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 0.3rem; font-size: 0.68rem; color: var(--text-dim); }
    .bubble .b-ticks { font-size: 0.78rem; }
    .bubble .b-ticks.read { color: #06b6d4; }
    .bubble .b-ticks.sent { color: #aaa; }
    .bubble audio, .bubble img, .bubble video { max-width: 100%; max-height: 300px; border-radius: 10px; display: block; margin-bottom: 0.4rem; }

    .history-section { margin-top: 2rem; }
    .history-title { font-family: 'Bangers', cursive; font-size: 1.6rem; letter-spacing: 2px; text-align: center; color: rgba(255,100,100,0.8); margin-bottom: 1rem; text-shadow: 0 0 10px rgba(200,0,0,0.3); }
    .history-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 1rem 1.2rem;
      margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; transition: all 0.3s;
    }
    .history-item:hover { background: rgba(200,0,0,0.08); border-color: rgba(200,0,0,0.2); }
    .history-item.pink { border-color: rgba(255,77,128,0.2); }
    .history-item.pink:hover { background: rgba(255,77,128,0.08); }
    .history-item .h-text { font-family: 'Caveat', cursive; font-size: 1.15rem; color: var(--text); flex:1; white-space: pre-wrap; }
    .history-item .h-date { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: linear-gradient(135deg, #cc0000, #ff4444); color: white; padding: 0.8rem 1.5rem; border-radius: 50px; z-index: 1000;
      font-family: 'Bangers', cursive; font-size: 1.2rem; letter-spacing: 1px; box-shadow: 0 8px 25px rgba(200,0,0,0.45);
      transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .corner-web { position: fixed; pointer-events: none; z-index: 1; opacity: 0.15; }
    .corner-web.tl { top: -10px; left: -10px; }
    .corner-web.tr { top: -10px; right: -10px; transform: scaleX(-1); }

    .spider-deco { position: fixed; top: -20px; right: 80px; z-index: 3; pointer-events: none; animation: spiderDrop 6s ease-in-out infinite; }
    @keyframes spiderDrop { 0% { top: -20px; } 40% { top: 120px; } 60% { top: 120px; } 100% { top: -20px; } }

  }

  function normalize(s) { return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

  function enterAsConstanza() {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(CONSTANZA));
    location.reload();
  }

  function doLogin() {
    const n  = normalize(document.getElementById('loginNombre').value);
    const pw = document.getElementById('loginPassword').value.trim();
    const err = document.getElementById('loginError');
    if (n !== IGNACIO.key) { err.textContent = '¡Solo el héroe puede entrar aquí! 💔'; return; }
    if (pw !== IGNACIO.password)     { err.textContent = '¡Contraseña incorrecta! 🔐'; return; }
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ key: IGNACIO.key, role: IGNACIO.role, display: IGNACIO.display }));
    location.reload();
  }

  function doLogout() { sessionStorage.removeItem(SESSION_KEY); location.reload(); }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('panelI').classList.contains('active')
        && document.getElementById('loginScreen').style.display !== 'none') doLogin();
  });

  // ============================================
  // JSONBIN (mensajes = Ignacio, mensajesConstanza = Constanza)
  // ============================================
  async function getRecord() {
    const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
    if (!res.ok) throw new Error('No se pudo leer');
    const data = await res.json();
    const rec = data.record || {};
    if (!Array.isArray(rec.mensajes)) rec.mensajes = [];
    if (!Array.isArray(rec.mensajesConstanza)) rec.mensajesConstanza = [];
    return rec;
  }

  async function saveRecord(record) {
    const res = await fetch(BIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify(record)
    });
    if (!res.ok) throw new Error('No se pudo guardar');
  }

  // ============================================
  // SESIÓN
  // ============================================
  let currentSession = null;

  // ============================================
  // RENDER — chat unificado estilo WhatsApp
  // ============================================
  async function render() {
    const session = currentSession;
    let record;
    try { record = await getRecord(); } catch(e) { return; }
    const msgs  = record.mensajes;         // de Ignacio
    const cMsgs = record.mensajesConstanza; // de Constanza

    // Combina ambos hilos en un solo feed, ordenado por el momento en que se enviaron
    const feed = msgs.map(m => ({ ...m, from: 'ignacio' }))
      .concat(cMsgs.map(m => ({ ...m, from: 'constanza' })))
      .sort((a, b) => Number(a.id) - Number(b.id));

    if (session.role === 'viewer' && msgs.some(m => m.readStatus !== 'read')) markRead();

    const feedEl = document.getElementById('chatFeed');
    const sig = JSON.stringify(feed.map(m => [m.from, m.id, m.readAt || m.readStatus || '']));
    if (feedEl.dataset.sig !== sig) {   // solo redibuja si cambió (así no se corta un audio/video en reproducción)
      feedEl.dataset.sig = sig;
      feedEl.innerHTML = feed.length
        ? feed.map(m => {
            const mine = (session.role === 'writer' && m.from === 'ignacio') || (session.role === 'viewer' && m.from === 'constanza');
            const showTicks = session.role === 'writer' && m.from === 'ignacio';
            const ticks = showTicks
              ? (m.readStatus === 'read'
                  ? `<span class="b-ticks read">✓✓ Visto${m.readAt ? ' · ' + escHtml(m.readAt) : ''}</span>`
                  : `<span class="b-ticks sent">✓ Enviado</span>`)
              : '';
            return `
              <div class="bubble ${mine ? 'align-right' : 'align-left'} from-${m.from}">
                ${mediaHtml(m.media)}
                ${m.text ? `<div class="b-text">${escHtml(m.text)}</div>` : ''}
                <div class="b-meta"><span>${escHtml(m.sentAt || '')}</span>${ticks}</div>
              </div>`;
          }).join('')
        : `<p class="chat-empty">Aún no hay mensajes, ¡escribe el primero! 💌</p>`;
      feedEl.scrollTop = feedEl.scrollHeight;
    }
  }

  // Marca como vistos releyendo justo antes de guardar (evita pisar mensajes nuevos)
  async function markRead() {
    try {
      const rec = await getRecord();
      let changed = false;
      rec.mensajes.forEach(m => { if (m.readStatus !== 'read') { m.readStatus = 'read'; m.readAt = nowLabel(); changed = true; } });
      if (changed) await saveRecord(rec);
    } catch(e) {}
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function nowLabel() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} - ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  }

  // ============================================
  // FOTOS / VIDEOS
  // ============================================
  let pendingFile = null;
  let pendingFileIsAudio = false;

  function pickMedia(inp) {
    const f = inp.files[0]; inp.value = '';
    if (!f) return;
    const isV = f.type.startsWith('video/'), isI = f.type.startsWith('image/');
    if (!isV && !isI) { showToast('Elige una foto o un video 📷'); return; }
    if (isV && f.size > 100*1024*1024) { showToast('Video muy pesado (máx 100 MB)'); return; }
    if (isI && f.size > 10*1024*1024)  { showToast('Foto muy pesada (máx 10 MB)'); return; }
    pendingFile = f; pendingFileIsAudio = false;
    const prevA = document.getElementById('audioPreview');
    if (prevA.src) { URL.revokeObjectURL(prevA.src); prevA.removeAttribute('src'); }
    prevA.style.display = 'none';
    document.getElementById('attachName').textContent = (isV ? '🎬 ' : '🖼️ ') + f.name;
    document.getElementById('attachPreview').style.display = 'flex';
    document.getElementById('attachClear').style.display = 'inline';
    updateAct('mine');
  }

  function clearMedia() {
    pendingFile = null; pendingFileIsAudio = false;
    document.getElementById('attachName').textContent = '';
    document.getElementById('attachPreview').style.display = 'none';
    const prev = document.getElementById('audioPreview');
    if (prev.src) { URL.revokeObjectURL(prev.src); prev.removeAttribute('src'); prev.style.display = 'none'; }
    updateAct('mine');
  }

  let pendingFileC = null;
  let pendingFileCIsAudio = false;

  function pickCMedia(inp) {
    const f = inp.files[0]; inp.value = '';
    if (!f) return;
    const isV = f.type.startsWith('video/'), isI = f.type.startsWith('image/');
    if (!isV && !isI) { showToast('Elige una foto o un video 📷'); return; }
    if (isV && f.size > 100*1024*1024) { showToast('Video muy pesado (máx 100 MB)'); return; }
    if (isI && f.size > 10*1024*1024)  { showToast('Foto muy pesada (máx 10 MB)'); return; }
    pendingFileC = f; pendingFileCIsAudio = false;
    const prevAC = document.getElementById('cAudioPreview');
    if (prevAC.src) { URL.revokeObjectURL(prevAC.src); prevAC.removeAttribute('src'); }
    prevAC.style.display = 'none';
    document.getElementById('cAttachName').textContent = (isV ? '🎬 ' : '🖼️ ') + f.name;
    document.getElementById('cAttachPreview').style.display = 'flex';
    document.getElementById('cAttachClear').style.display = 'inline';
    updateAct('c');
  }

  function clearCMedia() {
    pendingFileC = null; pendingFileCIsAudio = false;
    document.getElementById('cAttachName').textContent = '';
    document.getElementById('cAttachPreview').style.display = 'none';
    const prevC = document.getElementById('cAudioPreview');
    if (prevC.src) { URL.revokeObjectURL(prevC.src); prevC.removeAttribute('src'); prevC.style.display = 'none'; }
    updateAct('c');
  }

  function uploadMedia(file, onProgress, isAudio) {
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', UPLOAD_PRESET);
      const x = new XMLHttpRequest();
      x.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);
      x.upload.onprogress = e => { if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
      x.onload = () => {
        try {
          const r = JSON.parse(x.responseText);
          if (x.status >= 200 && x.status < 300 && r.secure_url)
            resolve({ url: r.secure_url, type: isAudio ? 'audio' : (r.resource_type === 'video' ? 'video' : 'image') });
          else reject(new Error((r.error && r.error.message) || 'Error de subida'));
        } catch (e) { reject(e); }
      };
      x.onerror = () => reject(new Error('Sin conexión'));
      x.send(fd);
    });
  }

  function mediaHtml(md) {
    if (!md || !md.url || !/^https:\/\//.test(md.url)) return '';
    if (md.type === 'audio') {
      return `<audio src="${escHtml(md.url)}" controls preload="metadata"></audio>`;
    }
    if (md.type === 'video') {
      const u = escHtml(md.url.replace('/upload/', '/upload/f_mp4,vc_h264,q_auto/'));
      return `<video src="${u}" controls playsinline preload="metadata"></video>`;
    }
    const u = escHtml(md.url.replace('/upload/', '/upload/f_auto,q_auto/'));
    return `<img src="${u}" alt="" loading="lazy" onclick="window.open(this.src)">`;
  }

  // ============================================
  // GRABAR AUDIO (mantener presionado, deslizar para cancelar/fijar)
  // ============================================
  let mediaRecorder = null, recChunks = [], recStream = null, recTimer = null, recSeconds = 0, recSide = null;
  let recStartX = 0, recStartY = 0, recLocked = false, recCancelled = false, recPressing = false;

  function fmtTime(s) {
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }

  function els(side) {
    const mine = side === 'mine';
    return {
      field: document.getElementById(mine ? 'field' : 'cField'),
      act: document.getElementById(mine ? 'act' : 'cAct'),
      recbar: document.getElementById(mine ? 'recbar' : 'cRecbar'),
      lock: document.getElementById(mine ? 'lock' : 'cLock'),
      timer: document.getElementById(mine ? 'timer' : 'cTimer'),
      sl: document.getElementById(mine ? 'sl' : 'cSl'),
      icMic: document.getElementById(mine ? 'icMic' : 'cIcMic'),
      icSend: document.getElementById(mine ? 'icSend' : 'cIcSend'),
      textarea: document.getElementById(mine ? 'msgInput' : 'cMsgInput')
    };
  }

  async function startRec(side, e) {
    recStartX = e.clientX; recStartY = e.clientY; recLocked = false; recCancelled = false;
    if (!navigator.mediaDevices || !window.MediaRecorder) { showToast('Tu navegador no permite grabar audio 🎤'); recPressing = false; return; }
    try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e2) { recPressing = false; showToast('No se pudo acceder al micrófono 🎤'); return; }
    if (!recPressing) { recStream.getTracks().forEach(t => t.stop()); return; }

    recSide = side; recChunks = [];
    const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
               : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRecorder = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
    mediaRecorder.ondataavailable = ev => { if (ev.data.size > 0) recChunks.push(ev.data); };
    mediaRecorder.onstop = () => {
      recStream.getTracks().forEach(t => t.stop());
      clearInterval(recTimer);
      const dur = recSeconds;
      const E = els(recSide);
      E.field.classList.remove('hide'); E.recbar.classList.add('hide'); E.lock.classList.add('hide');
      E.act.classList.remove('rec'); E.timer.textContent = '0:00'; E.sl.textContent = '‹ Desliza para cancelar';
      if (!recCancelled && dur > 0.6) {
        const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const ext = (mediaRecorder.mimeType || '').includes('mp4') ? 'm4a' : 'webm';
        const file = new File([blob], `nota_de_voz_${Date.now()}.${ext}`, { type: blob.type });
        const objUrl = URL.createObjectURL(blob);
        if (recSide === 'mine') {
          pendingFile = file; pendingFileIsAudio = true;
          document.getElementById('attachName').textContent = `🎤 Nota de voz (${fmtTime(dur)})`;
          document.getElementById('attachPreview').style.display = 'flex';
          document.getElementById('attachClear').style.display = 'inline';
          const prev = document.getElementById('audioPreview'); prev.src = objUrl; prev.style.display = 'block';
        } else {
          pendingFileC = file; pendingFileCIsAudio = true;
          document.getElementById('cAttachName').textContent = `🎤 Nota de voz (${fmtTime(dur)})`;
          document.getElementById('cAttachPreview').style.display = 'flex';
          document.getElementById('cAttachClear').style.display = 'inline';
          const prevC = document.getElementById('cAudioPreview'); prevC.src = objUrl; prevC.style.display = 'block';
        }
      }
      updateAct(recSide);
    };
    mediaRecorder.start();
    recSeconds = 0;
    const E = els(side);
    E.field.classList.add('hide'); E.recbar.classList.remove('hide'); E.lock.classList.remove('hide'); E.act.classList.add('rec');
    recTimer = setInterval(() => {
      recSeconds++;
      E.timer.textContent = fmtTime(recSeconds);
      if (recSeconds >= 120) endRec(side, false); // tope de 2 minutos
    }, 1000);
  }

  function endRec(side, cancel) {
    clearInterval(recTimer);
    recCancelled = cancel; recPressing = false; recLocked = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    else { const E = els(side); E.field.classList.remove('hide'); E.recbar.classList.add('hide'); E.lock.classList.add('hide'); E.act.classList.remove('rec'); }
  }

  function bindHold(side) {
    const E = els(side);
    E.act.addEventListener('pointerdown', e => {
      const hasText = E.textarea.value.trim().length > 0;
      const hasAttach = side === 'mine' ? !!pendingFile : !!pendingFileC;
      if (hasText || hasAttach) { side === 'mine' ? sendMessage() : sendConstanzaMessage(); return; }
      if (recLocked && mediaRecorder) { endRec(side, false); return; }
      recPressing = true; E.act.setPointerCapture(e.pointerId); startRec(side, e);
    });
    E.act.addEventListener('pointermove', e => {
      if (!recPressing || !mediaRecorder || recLocked) return;
      const dx = e.clientX - recStartX, dy = e.clientY - recStartY;
      if (dx < -90) { recPressing = false; endRec(side, true); }
      else if (dy < -70) {
        recLocked = true; recPressing = false;
        E.lock.classList.add('hide'); E.act.classList.remove('rec');
        E.sl.innerHTML = '<button type="button" style="background:none;border:0;color:var(--heart-pink);font-size:1.1rem;" onclick="endRec(\'' + side + '\', true)">🗑️</button>';
      }
    });
    E.act.addEventListener('pointerup', () => { if (recPressing) { recPressing = false; if (mediaRecorder) endRec(side, false); } });
    E.act.addEventListener('pointercancel', () => { if (recPressing) { recPressing = false; if (mediaRecorder) endRec(side, true); } });
    E.act.addEventListener('contextmenu', e => e.preventDefault());
  }

  function updateAct(side) {
    const E = els(side);
    const hasText = E.textarea.value.trim().length > 0;
    const hasAttach = side === 'mine' ? !!pendingFile : !!pendingFileC;
    const showSend = hasText || hasAttach;
    E.icMic.classList.toggle('hide', showSend);
    E.icSend.classList.toggle('hide', !showSend);
    E.act.setAttribute('aria-label', showSend ? 'Enviar' : 'Mensaje de voz');
  }

  // ============================================
  // EMOJIS Y MENÚ DE ADJUNTAR
  // ============================================
  const EMOJIS = ['🕷️','🕸️','❤️','💕','😍','🥰','😘','😂','😢','😡','🤔','😎','👍','🙏','🔥','✨','💔','🌹','🎶','😴','🤗','💪','🙈','🎉'];

  function setupComposer(side) {
    const textarea = document.getElementById(side === 'mine' ? 'msgInput' : 'cMsgInput');
    const emoBtn = document.getElementById(side === 'mine' ? 'emoBtn' : 'cEmoBtn');
    const emoPanel = document.getElementById(side === 'mine' ? 'emo' : 'cEmo');
    const clipBtn = document.getElementById(side === 'mine' ? 'clip' : 'cClip');
    const menuPanel = document.getElementById(side === 'mine' ? 'menu' : 'cMenu');
    const mediaInput = document.getElementById(side === 'mine' ? 'mediaInput' : 'cMediaInput');
    const camInput = document.getElementById(side === 'mine' ? 'camInput' : 'cCamInput');

    EMOJIS.forEach(em => {
      const s = document.createElement('span');
      s.textContent = em;
      s.onclick = () => { textarea.value += em; textarea.dispatchEvent(new Event('input')); };
      emoPanel.appendChild(s);
    });

    function closePop() { menuPanel.classList.add('hide'); emoPanel.classList.add('hide'); }
    emoBtn.onclick = () => { const o = emoPanel.classList.contains('hide'); closePop(); if (o) emoPanel.classList.remove('hide'); };
    clipBtn.onclick = () => { const o = menuPanel.classList.contains('hide'); closePop(); if (o) menuPanel.classList.remove('hide'); };
    menuPanel.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      closePop();
      if (b.dataset.k === 'cam') camInput.click(); else mediaInput.click();
    };
    document.getElementById('chatFeed').addEventListener('pointerdown', closePop);

    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px';
      updateAct(side);
    });
    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) {
        e.preventDefault();
        side === 'mine' ? sendMessage() : sendConstanzaMessage();
      }
    });

    bindHold(side);
  }

  // ============================================
  // ENVIAR — Ignacio (texto, foto o video)
  // ============================================
  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const act = document.getElementById('act');
    const txt = input.value.trim();
    if (!txt && !pendingFile) return;
    if (pendingFile && (!CLOUD_NAME || !UPLOAD_PRESET)) { showToast('Falta configurar Cloudinary 🔧'); return; }

    act.style.pointerEvents = 'none'; act.style.opacity = '0.5';
    try {
      let media = null;
      if (pendingFile) {
        showToast('Subiendo... ⏫');
        media = await uploadMedia(pendingFile, () => {}, pendingFileIsAudio);
      }
      const record = await getRecord();
      const msg = { id: String(Date.now()), sentAt: nowLabel(), text: txt, readStatus: 'sent' };
      if (media) msg.media = media;
      record.mensajes.push(msg);
      await saveRecord(record);

      input.value = ''; input.style.height = 'auto';
      clearMedia();
      updateAct('mine');
      showToast('¡Mensaje lanzado como telaraña! 🕷️💌');
      await render();
      setTimeout(openSms, 600);
    } catch (e) {
      showToast('Error al enviar 💔');
    } finally {
      act.style.pointerEvents = ''; act.style.opacity = '';
    }
  }

  // ============================================
  // ENVIAR — Constanza (sin límite)
  // ============================================
  async function sendConstanzaMessage() {
    const input = document.getElementById('cMsgInput');
    const act = document.getElementById('cAct');
    const txt = input.value.trim();
    if (!txt && !pendingFileC) return;
    if (pendingFileC && (!CLOUD_NAME || !UPLOAD_PRESET)) { showToast('Falta configurar Cloudinary 🔧'); return; }

    act.style.pointerEvents = 'none'; act.style.opacity = '0.5';
    try {
      let media = null;
      if (pendingFileC) {
        showToast('Subiendo... ⏫');
        media = await uploadMedia(pendingFileC, () => {}, pendingFileCIsAudio);
      }
      const record = await getRecord();
      const list = record.mensajesConstanza;
      const msg = { id: String(Date.now()), ts: Date.now(), sentAt: nowLabel(), text: txt };
      if (media) msg.media = media;
      list.push(msg);
      await saveRecord(record);

      input.value = ''; input.style.height = 'auto';
      clearCMedia();
      updateAct('c');
      showToast('¡Mensaje enviado! 💌💕');
      await render();
    } catch (e) {
      showToast('Error al enviar 💔');
    } finally {
      act.style.pointerEvents = ''; act.style.opacity = '';
    }
  }

  // ============================================
  // TOAST
  // ============================================
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ============================================
  // CORAZONES FLOTANTES
  // ============================================
  const heartEmojis = ['💕','❤️','💗','💖','💝','🕷️❤️','💓','♥️'];
  function spawnHeart() {
    const c = document.getElementById('heartsContainer');
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (0.8 + Math.random()*1.4) + 'rem';
    const dur = 6 + Math.random()*8;
    h.style.animationDuration = dur + 's';
    h.style.animationDelay = Math.random()*3 + 's';
    c.appendChild(h);
    setTimeout(() => h.remove(), (dur + 3) * 1000);
  }
  setInterval(spawnHeart, 1800);


  // ============================================
  // INTRO (solo Constanza)
  // ============================================
  function showIntro() {
    const el = document.getElementById('introScreen');
    for (let i = 0; i < 70; i++) {
      const d = document.createElement('div');
      d.className = 'intro-dot';
      const size = 1 + Math.random() * 2;
      d.style.width = d.style.height = size + 'px';
      d.style.left = Math.random() * 100 + '%';
      d.style.top = Math.random() * 100 + '%';
      d.style.animationDelay = (Math.random() * 3) + 's';
      d.style.animationDuration = (2 + Math.random() * 3) + 's';
      el.insertBefore(d, el.firstChild);
    }
    el.style.display = 'flex';
  }

  function closeIntro() {
    const el = document.getElementById('introScreen');
    el.classList.add('hide');
    setTimeout(() => { el.style.display = 'none'; }, 850);
  }

  // ============================================
  // INIT
  // ============================================
  (function() {
    const s = sessionStorage.getItem(SESSION_KEY);
    if (s) {
      currentSession = JSON.parse(s);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      document.getElementById('userBadge').textContent = currentSession.display;
      if (currentSession.role === 'viewer') showIntro();

      if (currentSession.role === 'writer') {
        document.getElementById('writePanel').style.display = 'block';
        document.getElementById('cWritePanel').style.display = 'none';
      } else {
        document.getElementById('writePanel').style.display = 'none';
        document.getElementById('cWritePanel').style.display = 'block';
      }

      setupComposer('mine');
      setupComposer('c');
      updateAct('mine');
      updateAct('c');

      render();
      setInterval(render, POLL_MS);
    }
  })();
</script>
