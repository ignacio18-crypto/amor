<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Para Ti 🌻</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet"/>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/index.min.js"></script>
  <style>
    :root {
      --cream: #fdf6e3; --warm: #f5e6c8; --gold: #e8a020;
      --rose: #e8748a; --rose-light: #f0a0b0; --rose-pale: #fce8ed;
      --green-light: #34c759; --brown: #7a5230; --ink: #3d2b1a;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; background: var(--cream); font-family: 'Lora', serif; overflow-x: hidden; position: relative; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 10%, rgba(255,220,120,0.25) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(232,116,138,0.15) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    .floatie { position: fixed; pointer-events: none; z-index: 1; animation: floatUp linear infinite; opacity: 0; font-size: 1.4rem; }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.7; }
      100% { transform: translateY(-100vh) rotate(360deg) scale(1.1); opacity: 0; }
    }
    #loginScreen { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: var(--cream); transition: opacity 0.6s; }
    .login-card { width: 90%; max-width: 380px; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-radius: 24px; padding: 2rem; text-align: center; border: 1px solid rgba(232,116,138,0.25); box-shadow: 0 8px 32px rgba(232,116,138,0.1); }
    .login-card h1 { font-family: 'Playfair Display', serif; color: var(--rose); margin-bottom: 0.3rem; }
    .login-card p { font-family: 'Caveat', cursive; color: #999; margin-bottom: 1.5rem; font-size: 1rem; }
    .login-field { margin-bottom: 1rem; text-align: left; }
    .login-field label { display: block; font-family: 'Caveat', cursive; font-size: 1rem; margin-bottom: 0.3rem; color: var(--brown); }
    .login-field input { width: 100%; border: 1.5px solid rgba(232,116,138,0.3); border-radius: 12px; padding: 0.8rem; font-family: 'Caveat', cursive; font-size: 1.1rem; outline: none; background: rgba(255,255,255,0.9); transition: border-color 0.2s; }
    .login-field input:focus { border-color: var(--rose); }
    .login-btn { width: 100%; background: linear-gradient(135deg, var(--rose), #d4506a); color: white; border: none; border-radius: 12px; padding: 0.9rem; font-family: 'Playfair Display', serif; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(232,116,138,0.35); transition: all 0.2s; }
    .login-btn:hover { transform: translateY(-1px); }
    #app { display: none; position: relative; z-index: 2; padding: 1.5rem; max-width: 640px; margin: 0 auto; }
    #app.visible { display: block; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .logout-btn { background: none; border: 1px solid rgba(122,82,48,0.2); border-radius: 20px; padding: 0.4rem 0.8rem; cursor: pointer; font-family: 'Caveat', cursive; font-size: 0.95rem; color: var(--brown); }
    .board-wrapper { position: relative; padding-right: 56px; }
    .board-frame { background: var(--brown); border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .board { background: #1e1008; border-radius: 6px; padding: 2rem; min-height: 200px; text-align: center; color: #fdf0dc; position: relative; }
    .chalk-text { font-family: 'Caveat', cursive; font-size: 1.8rem; line-height: 1.4; white-space: pre-wrap; }
    .loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; border-radius: 6px; font-size: 2rem; }
    .ticks-panel { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; align-items: center; gap: 4px; width: 48px; }
    .tick-row { display: flex; align-items: center; gap: 1px; }
    .tick { font-size: 1.4rem; line-height: 1; font-weight: bold; }
    .tick-label { font-family: 'Caveat', cursive; font-size: 0.65rem; text-align: center; line-height: 1.1; margin-top: 2px; }
    .countdown-box { margin-top: 1.5rem; background: rgba(255,255,255,0.75); backdrop-filter: blur(8px); border: 1px solid rgba(232,116,138,0.2); border-radius: 16px; padding: 1rem 1.5rem; text-align: center; }
    .countdown-label { font-family: 'Caveat', cursive; font-size: 0.95rem; color: #888; margin-bottom: 0.3rem; }
    .countdown-time { font-family: 'Caveat', cursive; font-size: 2.2rem; color: var(--rose); font-weight: 700; letter-spacing: 3px; }
    .countdown-done { font-family: 'Caveat', cursive; font-size: 1.3rem; color: #34c759; }
    .write-panel { margin-top: 2rem; background: var(--rose-pale); padding: 1.5rem; border-radius: 16px; border: 1px solid rgba(232,116,138,0.15); }
    .write-panel h3 { font-family: 'Caveat', cursive; font-size: 1.2rem; margin-bottom: 1rem; color: var(--brown); }
    textarea { width: 100%; height: 100px; border-radius: 10px; padding: 1rem; font-family: 'Caveat', cursive; font-size: 1.2rem; margin-bottom: 1rem; border: 1px solid var(--rose-light); outline: none; resize: vertical; background: white; }
    textarea:focus { border-color: var(--rose); }
    #sendBtn { width: 100%; background: linear-gradient(135deg, var(--rose), #d4506a); color: white; border: none; border-radius: 12px; padding: 0.9rem; font-family: 'Playfair Display', serif; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(232,116,138,0.3); transition: all 0.2s; }
    #sendBtn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
    .history-section { margin-top: 3rem; margin-bottom: 3rem; }
    .history-section h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; text-align: center; color: var(--brown); margin-bottom: 1rem; }
    .history-item { background: white; margin-top: 0.5rem; padding: 1rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: flex-start; font-family: 'Caveat', cursive; box-shadow: 0 2px 8px rgba(0,0,0,0.05); gap: 1rem; }
    .history-item span { flex: 1; font-size: 1.05rem; }
    .history-item small { opacity: 0.45; white-space: nowrap; font-size: 0.85rem; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--rose); color: white; padding: 0.8rem 1.5rem; border-radius: 50px; transition: 0.4s; z-index: 1000; font-family: 'Caveat', cursive; font-size: 1rem; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .readonly-banner { text-align: center; margin-top: 2rem; font-family: 'Caveat', cursive; font-size: 1.1rem; opacity: 0.7; }
  </style>
</head>
<body>

<div id="toast"></div>

<div id="loginScreen">
  <div class="login-card">
    <h1>Hola 🌻</h1>
    <p>Un lugar solo para nosotros</p>
    <div class="login-field">
      <label>Nombre</label>
      <input type="text" id="loginNombre" placeholder="Tu nombre" autocomplete="given-name"/>
    </div>
    <div class="login-field">
      <label>Apellido</label>
      <input type="text" id="loginApellido" placeholder="Tu apellido" autocomplete="family-name"/>
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input type="password" id="loginPassword" placeholder="Tu contraseña"/>
    </div>
    <button class="login-btn" onclick="doLogin()">Entrar 🌸</button>
    <p id="loginError" style="color:#e8748a; font-size:0.85rem; margin-top:10px; font-family:'Caveat'"></p>
  </div>
</div>

<div id="app">
  <div class="top-bar">
    <div id="userBadge" style="font-family:'Caveat'; font-size:1.2rem; color:var(--brown);"></div>
    <button class="logout-btn" onclick="doLogout()">Salir 🚪</button>
  </div>

  <header style="text-align:center; margin-bottom:2rem;">
    <h1 style="font-family:'Playfair Display'; color:var(--rose); font-size:1.8rem;">Para Ti, Mi Amor</h1>
  </header>

  <div class="board-wrapper">
    <div class="board-frame">
      <div class="board">
        <div id="loader" class="loading-overlay">⏳</div>
        <div id="chalkText" class="chalk-text">Cargando mensaje...</div>
        <div id="boardDate" style="margin-top:1rem; opacity:0.5; font-size:0.8rem; font-family:'Caveat';"></div>
      </div>
    </div>
    <div class="ticks-panel" id="ticksPanel">
      <div class="tick-row">
        <span class="tick" id="tick1">✓</span>
        <span class="tick" id="tick2" style="display:none;">✓</span>
      </div>
      <div class="tick-label" id="tickLabel">Enviado</div>
    </div>
  </div>

  <div class="countdown-box" id="countdownBox" style="display:none;">
    <div class="countdown-label">⏰ Próximo mensaje en</div>
    <div class="countdown-time" id="countdownTime">--:--:--</div>
  </div>
  <div class="countdown-box" id="countdownReady" style="display:none;">
    <div class="countdown-done">✨ ¡Ya puedes escribir un nuevo mensaje! ✨</div>
  </div>

  <div id="writePanel" class="write-panel" style="display:none;">
    <h3>✍️ Escribe tu mensaje de hoy</h3>
    <textarea id="msgInput" placeholder="Escribe algo lindo para hoy..."></textarea>
    <button class="login-btn" id="sendBtn" onclick="sendMessage()">Poner en la pizarra 💌</button>
  </div>

  <div id="readonlyBanner" class="readonly-banner" style="display:none;">
    🌻 Cada día aparecerá un mensaje nuevo aquí 💛
  </div>

  <div class="history-section">
    <h2>Mensajes pasados</h2>
    <div id="historyList"></div>
  </div>
</div>

<script>
  const BIN_ID   = '69c762eeaa77b81da92a5074';
  const API_KEY  = '$2a$10$ULqyvo9Ld7OrgfTQAMAuVewv2GCHHWKKCWrFb8DT8gQFexyuPN.4e';
  const BIN_URL  = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
  
  // EmailJS (reemplaza con TUS credenciales)
  const EMAILJS_SERVICE = 'YOUR_SERVICE_ID';     // Ej: service_abc123xyz
  const EMAILJS_TEMPLATE = 'YOUR_TEMPLATE_ID';   // Ej: template_abc123xyz
  const EMAILJS_KEY = 'YOUR_PUBLIC_KEY';         // Ej: abc123xyz456

  const USERS = {
    'ignacio calderon': { password: 'Corte123@',  role: 'writer', display: 'Ignacio',   emoji: '✍️' },
    'constanza soto':  { password: 'potoloco123', role: 'viewer', display: 'Constanza', emoji: '🌸' },
  };

  const SESSION_KEY = 'amor_session_v3';

  function normalize(str) {
    return str.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  function doLogin() {
    const n  = normalize(document.getElementById('loginNombre').value);
    const a  = normalize(document.getElementById('loginApellido').value);
    const pw = document.getElementById('loginPassword').value.trim();
    const key = n + ' ' + a;
    const user = USERS[key];
    if (!user) { document.getElementById('loginError').textContent = 'No estás en la lista 💔'; return; }
    if (user.password !== pw) { document.getElementById('loginError').textContent = 'Contraseña incorrecta 🔐'; return; }
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ key, role: user.role, display: user.display, emoji: user.emoji }));
    location.reload();
  }

  function doLogout() { sessionStorage.removeItem(SESSION_KEY); location.reload(); }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function getRecord() {
    try {
      const res  = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
      const data = await res.json();
      return data.record || { mensajes: [] };
    } catch(e) { return { mensajes: [] }; }
  }

  async function saveRecord(record) {
    await fetch(BIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
      body: JSON.stringify(record)
    });
  }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function startCountdown(hasTodayMsg) {
    const boxCD    = document.getElementById('countdownBox');
    const boxReady = document.getElementById('countdownReady');
    const timeEl   = document.getElementById('countdownTime');
    if (hasTodayMsg) {
      boxCD.style.display = 'block'; boxReady.style.display = 'none';
      const tick = () => {
        const midnight = new Date(); midnight.setHours(24,0,0,0);
        const diff = midnight - Date.now();
        if (diff <= 0) { location.reload(); return; }
        const h = String(Math.floor(diff/3600000)).padStart(2,'0');
        const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
        const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
        timeEl.textContent = `${h}:${m}:${s}`;
      };
      tick(); setInterval(tick, 1000);
    } else {
      boxCD.style.display = 'none'; boxReady.style.display = 'block';
    }
  }

  function renderTicks(status) {
    const panel = document.getElementById('ticksPanel');
    const t1 = document.getElementById('tick1');
    const t2 = document.getElementById('tick2');
    const lbl = document.getElementById('tickLabel');
    panel.style.display = 'flex';
    if (status === 'read') {
      t1.style.color = '#34c759'; t2.style.color = '#34c759';
      t2.style.display = 'inline'; lbl.textContent = 'Visto 💚'; lbl.style.color = '#34c759';
    } else if (status === 'delivered') {
      t1.style.color = '#aaa'; t2.style.color = '#aaa';
      t2.style.display = 'inline'; lbl.textContent = 'Entregado'; lbl.style.color = '#aaa';
    } else {
      t1.style.color = '#aaa'; t2.style.display = 'none';
      lbl.textContent = 'Enviado'; lbl.style.color = '#aaa';
    }
  }

  async function render(session) {
    const record   = await getRecord();
    const msgs     = record.mensajes || [];
    const today    = todayStr();
    const todayMsg = msgs.find(m => m.date === today);

    document.getElementById('chalkText').textContent = todayMsg ? todayMsg.text : 'Aún no hay mensaje hoy... 🌻';
    document.getElementById('boardDate').textContent = todayMsg ? `📅 ${today}` : '';

    if (session.role === 'writer') {
      document.getElementById('writePanel').style.display = 'block';
      const btn = document.getElementById('sendBtn');
      btn.disabled = !!todayMsg;
      btn.textContent = todayMsg ? 'Ya enviado hoy ✅' : 'Poner en la pizarra 💌';
      if (todayMsg) renderTicks(todayMsg.readStatus || 'sent');
      else document.getElementById('ticksPanel').style.display = 'none';
    } else {
      document.getElementById('ticksPanel').style.display = 'none';
      document.getElementById('readonlyBanner').style.display = 'block';
      if (todayMsg && todayMsg.readStatus !== 'read') {
        todayMsg.readStatus = 'read';
        record.mensajes = msgs;
        saveRecord(record);
      }
    }

    startCountdown(!!todayMsg);

    const history = msgs.filter(m => m.date !== today).reverse();
    document.getElementById('historyList').innerHTML = history.length
      ? history.map(m => `<div class="history-item"><span>${escHtml(m.text)}</span><small>${m.date}</small></div>`).join('')
      : `<p style="text-align:center;font-family:'Caveat';opacity:0.5;margin-top:1rem;">Aún no hay mensajes pasados 🌻</p>`;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    const txt = document.getElementById('msgInput').value.trim();
    if (!txt) { showToast('Escribe algo primero 💭'); return; }
    document.getElementById('loader').style.display = 'flex';
    document.getElementById('sendBtn').disabled = true;

    const record = await getRecord();
    const msgs   = record.mensajes || [];
    if (msgs.find(m => m.date === todayStr())) { showToast('Ya enviaste hoy ✅'); location.reload(); return; }

    msgs.push({ date: todayStr(), text: txt, readStatus: 'sent' });
    record.mensajes = msgs;
    await saveRecord(record);

    // Email notification via EmailJS
    try {
      await sendEmailNotification(txt);
    } catch(e) { console.warn('Email no enviado:', e); }

    showToast('¡Mensaje enviado con amor! 💌');
    setTimeout(() => location.reload(), 1500);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Email via EmailJS
  async function sendEmailNotification(msgText) {
    if (!EMAILJS_SERVICE || EMAILJS_SERVICE.includes('YOUR_')) {
      console.warn('EmailJS no configurado. Configura tus credenciales en el código.');
      return;
    }
    
    try {
      emailjs.init(EMAILJS_KEY);
      await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
        to_email: 'constanza.sotoo21@gmail.com', // Email de Constanza
        message: msgText,
        from_name: 'Ignacio'
      });
      console.log('Email enviado exitosamente');
    } catch(e) {
      console.warn('Error enviando email:', e);
    }
  }

  (function() {
    const s = sessionStorage.getItem(SESSION_KEY);
    if (s) {
      const user = JSON.parse(s);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      document.getElementById('userBadge').textContent = user.emoji + ' ' + user.display;
      render(user);
    }
  })();

  function spawn() {
    const el = document.createElement('div');
    el.className = 'floatie';
    el.textContent = ['🌻','💛','🌸','✨'][Math.floor(Math.random()*4)];
    el.style.left = Math.random()*90+'vw';
    el.style.bottom = '-20px';
    el.style.animationDuration = (5+Math.random()*5)+'s';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 10000);
  }
  setInterval(spawn, 3000);
</script>
</body>
</html>
